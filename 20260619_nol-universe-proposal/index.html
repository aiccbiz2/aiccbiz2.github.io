<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:#0A0A0B;color:#fff;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;padding:48px;-webkit-font-smoothing:antialiased}

.vc h2{font-size:22px;font-weight:800;margin:12px 0 8px;letter-spacing:-.01em}
.vc p{font-size:14px;color:#B5B5BC;line-height:1.55}
.vc .go{margin-top:18px;font-size:14px;color:#FF4DA6;font-weight:700}

<body>
  <div class="brand">NOL UNIVERSE &times; LG U+</div>

  <div class="cards">

      <h2>전략 강화본</h2>

      <div class="go">열기 →</div>
    </a>
  </div>
  <div class="foot">2026.06.19</div>
